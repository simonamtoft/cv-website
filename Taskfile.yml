# https://taskfile.dev
# Tasks delegate to the npm scripts in package.json, which stay the source of truth.
version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  install:
    desc: Install npm dependencies from the lockfile
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci

  dev:
    desc: Start the Vite dev server on localhost:4317
    aliases: [start]
    deps: [install]
    cmds:
      - npm run dev

  build:
    desc: Build the production bundle into build/client
    deps: [install]
    cmds:
      - npm run build

  preview:
    desc: Preview the production build on localhost:4317
    deps: [build]
    cmds:
      - npm run preview

  test:
    desc: "Run the Playwright suite (pass args after --, e.g. task test -- tests/nav.spec.js)"
    deps: [install]
    cmds:
      - npm test -- {{.CLI_ARGS}}

  check:sources:
    desc: Check source URLs declared in article frontmatter
    deps: [install]
    cmds:
      - npm run check:article-sources

  audit:
    desc: Audit npm dependencies for known vulnerabilities
    cmds:
      - npm audit

  verify:
    desc: Build, check article sources, run tests on a free port, and audit
    deps: [install]
    cmds:
      - npm run build
      - npm run check:article-sources
      - |
        port=$(node -e 'const s = require("node:net").createServer(); s.listen(0, "127.0.0.1", () => { process.stdout.write(String(s.address().port)); s.close(); });')
        PLAYWRIGHT_PORT="$port" npm test
      - npm audit
