<!doctype html>
<!-- Template for the link-preview images. scripts/og/generate.mjs opens this
     file, calls one of the render functions below, and screenshots #card. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Source Serif 4'; font-weight: 500; src: url(fonts/source-serif-4-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter Tight'; font-weight: 400; src: url(fonts/inter-tight-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }

  * { box-sizing: border-box; margin: 0; }
  #card { width: 1200px; height: 630px; overflow: hidden; display: flex; background: #fbfbf9; color: #0b1b3a; }
  img { display: block; }
  .text { display: flex; flex-direction: column; overflow: hidden; }
  .kicker { font: 500 24px 'IBM Plex Mono', monospace; letter-spacing: .04em; text-transform: uppercase; color: #c2300c; }
  .heading { font-family: 'Source Serif 4', serif; font-weight: 500; letter-spacing: -.01em; }
  .byline { display: flex; align-items: center; gap: 16px; margin-top: auto; font: 500 24px 'IBM Plex Mono', monospace; color: #4a5873; }
  .byline img { width: 44px; height: 44px; }

  .site .text { width: 700px; padding: 72px 64px; }
  .site .heading { font-size: 76px; line-height: 1.04; margin-top: 28px; }
  .site .line { font: 400 32px/1.35 'Inter Tight', sans-serif; color: #4a5873; margin-top: 28px; }
  .site .portrait { width: 500px; height: 630px; object-fit: cover; }

  .project .text { width: 520px; padding: 64px 48px 56px 64px; }
  .project .heading { font-size: 54px; line-height: 1.1; margin: 24px 0; }
  .project .art { width: 680px; display: flex; align-items: center; background: #f1f2f0; border-left: 2px solid #c9cfd9; }
  .project .art img { width: 680px; height: 382.5px; }
</style>
</head>
<body>
<div id="card"></div>
<script>
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    node.className = className;
    if (text) node.textContent = text;
    return node;
  };
  const image = (src, className = '') => {
    const node = el('img', className);
    node.src = src;
    return node;
  };

  function textColumn({ kicker, heading, line, byline }) {
    const column = el('div', 'text');
    const footer = el('div', 'byline');
    footer.append(image('../../public/favicon.svg'), el('span', '', byline));
    column.append(el('div', 'kicker', kicker), el('div', 'heading', heading));
    if (line) column.append(el('div', 'line', line));
    column.append(footer);
    return column;
  }

  // Resolves to true when the text does not fit its column, so the generator
  // can fail instead of publishing a clipped card.
  async function show(variant, ...children) {
    const card = document.getElementById('card');
    card.className = variant;
    card.replaceChildren(...children);
    await document.fonts.ready;
    await Promise.all([...card.querySelectorAll('img')].map((img) => img.decode()));
    const column = card.querySelector('.text');
    return column.scrollHeight > column.clientHeight || column.scrollWidth > column.clientWidth;
  }

  window.renderSiteCard = ({ name, role, line, domain }) =>
    show('site', textColumn({ kicker: role, heading: name, line, byline: domain }), image('portrait.jpg', 'portrait'));

  window.renderProjectCard = ({ industry, title, name, coverUrl }) => {
    const art = el('div', 'art');
    art.append(image(coverUrl));
    return show('project', textColumn({ kicker: industry, heading: title, byline: name }), art);
  };
</script>
</body>
</html>
